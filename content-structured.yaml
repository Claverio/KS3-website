      image:
        _image_note: "Resolusi ~180x150px, format PNG/SVG"
        _image_description: >
          Ilustrasi multi-goal (ikon graduation cap + rumah + pesawat)
          yang menggambarkan berbagai tujuan simpanan.
      title: "Simpanan Tujuan"
