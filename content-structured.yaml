      - "Copy terlalu panjang per paragraf — pecah jadi kalimat lebih singkat"
      - "CTA generik 'KIRIM' → ganti dengan CTA berbasis outcome"
      - "Campuran bahasa ('Read more', 'Follow') → konsistenkan ke Bahasa Indonesia"
      - "Copyright © 2022 → update ke tahun berjalan"
      - "YouTube link mengarah ke homepage → perbaiki ke channel YouTube"

  dual_persona_approach:
    persona_1_penyimpan_pendana:
      who: "Anggota yang ingin menyimpan dana atau mendanai UMKM via P2P"
      motivation: "Ikut berpartisipasi memajukan UMKM + hasil kompetitif"
      cta_language: "Mulai Menyimpan, Danai UMKM, Lihat Produk Simpanan"

    persona_2_umkm:
      who: "Pelaku UMKM yang membutuhkan pembiayaan"
      motivation: "Akses modal usaha yang cepat, mudah, dan ringan"
      cta_language: "Ajukan Pembiayaan, Cek Syarat, Hubungi Kami"
      _source: >
        Copy existing: "Proses pinjaman cepat, mudah, dan ringan"
        (section Kompetitif)

  p2p_integration_summary: >
    P2P Lending diintegrasikan ke dalam 5 dari 10 blocks:
    1. Hero → Subtitle menjelaskan P2P sebagai layanan terbaru KS3
    2. Marquee → "P2P Lending" dan "Pendanaan Langsung" sebagai keyword
    3. About → Paragraf kedua menjelaskan evolusi ke P2P
    4. Services → P2P Lending sebagai produk card #1 dengan badge "Baru"
    5. FAQ → 3 pertanyaan spesifik menjawab keraguan soal P2P koperasi
    Pendekatan ini membuat P2P terasa sebagai evolusi natural,
    bukan produk asing yang ditempelkan ke koperasi.

