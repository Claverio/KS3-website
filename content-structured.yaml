  # produk pilihan yang "dijual".

  _design_notes: >
    Layout: grid. Card P2P Lending HARUS lebih menonjol:
    - Opsi 1: ukuran card 2x width (span full row di desktop)
    - Opsi 2: warna card berbeda (gradient brand) + badge "Baru"
    - Opsi 3: spotlight/glow effect di belakang card
