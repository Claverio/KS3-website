      - item: "Syarat menjadi anggota (lengkap)"
        used_in: "faq_section"
      - item: "Nominal Simpanan Pokok dan Simpanan Wajib"
        used_in: "faq_section, footer_note"
      - item: "URL YouTube channel yang benar"
