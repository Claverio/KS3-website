      _rename_rationale: >
        "Simpanan Lain" terdengar seperti sisa/tidak penting.
        "Simpanan Tujuan" lebih positif dan menjelaskan fungsinya.
        PERLU APPROVAL dari tim KS3 untuk rename ini.
      description: >
        Alokasikan simpanan Anda secara mandiri untuk kebutuhan
        spesifik: dana hari tua, pendidikan anak, atau rekreasi.
        Setiap tujuan bisa diatur dan dipantau melalui platform.
      link: "/produk/simpanan-tujuan"
      _cta_text: "Lihat Detail →"
      _source_copy: >
