    Setiap card: image, title, description, CTA link.
    Hover: card elevates dengan shadow yang intensified.
    Footer note ditampilkan di bawah cards sebagai teks kecil.

# =====================================================
# BLOCK 9: FAQ SECTION
# Funnel Stage: OBJECTION HANDLING — Hilangkan keraguan
# =====================================================

faq_section:
  _funnel_stage: "objection_handling"
  _purpose: >
    Menjawab keraguan terakhir sebelum konversi. FAQ diurutkan dari
    pertanyaan umum → spesifik produk → keamanan/trust.
    Jawaban HARUS berdasarkan fakta. Jika belum ada info resmi,
    tandai sebagai [PERLU KONFIRMASI].

  badge_text: "Pertanyaan Umum"

  title: "Yang Sering Ditanyakan tentang KS3"

  description: >
    Kami memahami bahwa memilih layanan keuangan adalah keputusan penting.
    Berikut jawaban atas pertanyaan yang paling sering kami terima.

  contact_email: "cs@koperasiks3.id"
  # KONFIRMASI email yang benar dengan tim KS3

  support_image:
    _image_note: "Resolusi 156x113px, format PNG"
    _image_description: >
      Foto customer service representative KS3 atau ilustrasi
      avatar CS yang friendly (headset, senyum). Memberikan kesan
      "ada manusia yang bisa dihubungi".

  support_text: "Butuh bantuan lebih lanjut? Hubungi tim kami."

  faqs:
    # ── PERTANYAAN UMUM ──
    - question: "Apa itu KS3?"
      answer: >
        KSP Sentra Solusi Sejahtera (KS3) adalah koperasi simpan pinjam
        berbasis digital yang bertujuan membangun para pelaku UMKM
        dalam mengembangkan bisnisnya melalui pembiayaan yang efisien,
        serta memberikan kesempatan kepada anggota penyimpan untuk ikut
        berpartisipasi memajukan UMKM di Indonesia.
      _source: "Narasi footer website existing — copy hampir persis"

    - question: "Apa itu P2P Lending dan apa hubungannya dengan koperasi?"
      answer: >
        P2P (Peer-to-Peer) Lending adalah model pendanaan di mana dana
        dari anggota pendana disalurkan langsung kepada pelaku UMKM
        melalui platform digital. Di KS3, layanan P2P Lending beroperasi
        di bawah payung koperasi simpan pinjam terdaftar — sehingga
        memiliki struktur organisasi, pengawasan, dan mekanisme
        keanggotaan yang jelas. Ini adalah layanan terbaru dari KS3.
      _source: "Penjelasan produk baru, berdasarkan konsep P2P koperasi"

    - question: "Apa saja produk simpanan yang tersedia?"
      answer: >
        KS3 menyediakan beberapa jenis simpanan:
        (1) Simpanan Berjangka — dengan tenor 3, 6, dan 12 bulan
        serta hasil yang kompetitif,
        (2) Simpanan Sukarela — bisa dilakukan kapan saja tanpa
        batasan tertentu,
        (3) Simpanan Tujuan — untuk kebutuhan hari tua, pendidikan,
        dan rekreasi yang dialokasikan secara mandiri.
        Selain itu, sebagai anggota Anda juga memiliki Simpanan Pokok
        (satu kali saat mendaftar) dan Simpanan Wajib (bulanan).
      _source: "Semua produk dari section Produk Unggulan website existing"

    # ── PERTANYAAN PROSES ──
    - question: "Bagaimana cara menjadi anggota KS3?"
      answer: >
        [PERLU KONFIRMASI DARI TIM KS3]
        Proses pendaftaran dapat dilakukan melalui platform digital kami.
        Syarat dan langkah-langkah detail akan segera tersedia
        di halaman Cara Menjadi Anggota.
      _source: "Belum ada di website — info ini HARUS diisi oleh tim KS3"

    - question: "Apakah ada aplikasi mobile?"
      answer: >
        Ya. KS3 memiliki aplikasi SmartCoop Anggota yang tersedia di
        Google Play Store. Melalui aplikasi ini, anggota dapat mengakses
        dan mengelola layanan koperasi secara digital.
      _source: >
        Fakta — link ke Play Store ada di hero banner dan download section:
        https://play.google.com/store/apps/details?id=com.fourvisionmedia.smartcoopAnggota.Sentra

    # ── PERTANYAAN TRUST ──
    - question: "Apakah KS3 terdaftar resmi?"
      answer: >
        Ya. KS3 beroperasi sebagai Koperasi Simpan Pinjam (KSP) yang
        terdaftar di bawah Kementerian Koperasi dan UKM Republik Indonesia.
        Kantor kami berlokasi di Werkspace Pluit, Jl. Pluit Indah No.168B,
        Jakarta Utara.
      _source: "Nama legal dan alamat dari footer website existing"
      _note: >
        TAMBAHKAN nomor badan hukum koperasi / NIK jika tersedia.
        Ini sangat penting untuk trust di layanan keuangan.

    - question: "Apakah dana saya aman?"
      answer: >
        KS3 memiliki sistem pengendalian internal yang baik dengan tim
        yang kompeten dalam memberikan pelayanan. Sebagai koperasi
        terdaftar, kami menjalankan mekanisme pengawasan organisasi
        sesuai ketentuan yang berlaku.
      _source: >
        Berdasarkan copy existing di section "Terverfikasi":
        "Mempunyai sistem pengendalian internal yang baik dengan tim
        yang kompeten dalam hal memberikan pelayanan"
      _note: >
        Jawaban ini PERLU diperkuat dengan info tambahan: audit,
        mekanisme mitigasi risiko, dll. Tim KS3 harus melengkapi.

    - question: "Bagaimana cara menghubungi KS3?"
      answer: >
        Anda bisa menghubungi kami melalui:
        — Form kontak di website ini
        — Email: [ISI EMAIL RESMI]
        — Kunjungi kantor kami di Werkspace Pluit, B-G 168,
          Jl. Pluit Indah No.168B, Jakarta Utara 14450
        Kami juga aktif di Instagram (@koperasiks3) dan
        Facebook (koperasiks3).
      _source: "Data kontak dari footer website existing"

    - question: "Berapa imbal hasil simpanan dan pendanaan P2P?"
      answer: >
        [PERLU KONFIRMASI DARI TIM KS3]
        Informasi detail mengenai imbal hasil untuk masing-masing
        produk akan tersedia di halaman produk. Silakan hubungi
        tim kami untuk konsultasi lebih lanjut.
      _source: >
        Website existing menyebut "hasil yang kompetitif" untuk
        Simpanan Berjangka, tapi TIDAK menyebutkan angka spesifik.

    - question: "Apa yang membedakan KS3 dengan fintech P2P lainnya?"
      answer: >
        KS3 adalah koperasi simpan pinjam terdaftar yang menjalankan
        layanan P2P lending di bawah payung organisasi koperasi.
        Ini berarti ada struktur keanggotaan, Rapat Anggota Tahunan,
        pengurus dan pengawas yang dipilih anggota, serta tata kelola
        yang diatur oleh regulasi koperasi — bukan semata-mata
        platform teknologi tanpa badan hukum koperasi.
      _source: "Diferensiasi structural — koperasi vs fintech"

  _design_notes: >
    Layout: accordion FAQ di kanan (60%), support card di kiri (40%).
    Accordion smooth, satu FAQ terbuka per waktu, FAQ pertama open by default.
    Support card: foto CS, support_text, email, tombol "Hubungi via WhatsApp".
    Background putih/sangat terang.
    Optional: filter tab "Umum" / "Produk" / "Keamanan".

