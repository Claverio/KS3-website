  background_image:
    _image_note: "Resolusi 1920x800px, format WebP, subtle & terang"
    _image_description: >
      Subtle geometric pattern atau solid light color dengan texture
      minimal. Background TIDAK boleh bersaing dengan product cards.

  badge_text: "Produk & Layanan"

  title: "Solusi Keuangan untuk Setiap Kebutuhan"

  services:

    # ──────────────────────────────────────────────────
    # PRODUK BARU: P2P LENDING
    # ──────────────────────────────────────────────────
    - id: "p2p-lending"
      _status: "PRODUK BARU — belum ada di website existing"
      image:
        _image_note: "Resolusi ~180x150px (height 150), format PNG/SVG"
