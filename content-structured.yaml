          Warna dominan brand primer.
      title: "Pendanaan P2P Lending"
      description: >
        Danai pelaku UMKM terverifikasi secara langsung melalui
        platform digital KS3. Pilih sendiri UMKM yang ingin Anda
        dukung, dan pantau perkembangan pendanaan Anda secara
        real-time dari dashboard atau aplikasi SmartCoop.
      link: "/produk/p2p-lending"
      _badge: "🆕 Baru"
      _cta_text: "Pelajari Selengkapnya →"
      _note: >
        TIDAK menyebutkan angka imbal hasil karena belum ada data
        resmi. Setelah ada rate yang disetujui, tambahkan di highlights.

    # ──────────────────────────────────────────────────
    # PRODUK EXISTING: SIMPANAN BERJANGKA
    # ──────────────────────────────────────────────────
    - id: "simpanan-berjangka"
      _status: "PRODUK EXISTING — ada di website saat ini"
      image:
        _image_note: "Resolusi ~180x150px, format PNG/SVG"
        _image_description: >
          Ilustrasi kalender + koin atau ikon time-deposit.
          Gaya konsisten dengan card lainnya.
      title: "Simpanan Berjangka"
      description: >
        Tempatkan dana Anda pada tenor 3, 6, atau 12 bulan.
        Simpanan berjangka KS3 menawarkan hasil yang kompetitif
        bagi anggota yang ingin merencanakan keuangan jangka
        menengah dengan kepastian.
      link: "/produk/simpanan-berjangka"
      _cta_text: "Lihat Detail →"
      _source_copy: >
        Copy original di website: "simpanan dengan tempo 3, 6,
        dan 12 bulan dan mendapatkan hasil yang kompetitif"

    # ──────────────────────────────────────────────────
    # PRODUK EXISTING: SIMPANAN SUKARELA
    # ──────────────────────────────────────────────────
    - id: "simpanan-sukarela"
      _status: "PRODUK EXISTING — ada di website saat ini"
      image:
        _image_note: "Resolusi ~180x150px, format PNG/SVG"
        _image_description: >
          Ilustrasi dompet/wallet dengan panah masuk-keluar
          menunjukkan fleksibilitas. Gaya konsisten.
      title: "Simpanan Sukarela"
      description: >
        Simpanan fleksibel yang bisa dilakukan kapan saja oleh
        anggota tanpa batasan tertentu. Cocok sebagai tabungan
        harian atau dana cadangan yang bisa ditarik sewaktu-waktu.
      link: "/produk/simpanan-sukarela"
      _cta_text: "Lihat Detail →"
      _source_copy: >
