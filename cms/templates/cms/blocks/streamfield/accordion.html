{% load wagtailcore_tags %}<div class="accordion accordion-style-01 mb-30px" id="accordion-{{ block.id }}">{% for item in value.items %}<div class="accordion-item bg-white{% if forloop.first %} active-accordion{% endif %}"><div class="accordion-header"><a href="#" data-bs-toggle="collapse" data-bs-target="#accordion-{{ block.id }}-{{ forloop.counter }}"><div class="accordion-title fs-18 d-flex align-items-center text-dark-gray fw-600 alt-font">{{ item.title }}<span><i class="fa-solid fa-angle-right icon-small"></i></span></div></a></div><div id="accordion-{{ block.id }}-{{ forloop.counter }}" class="accordion-collapse collapse{% if forloop.first %} show{% endif %}" data-bs-parent="#accordion-{{ block.id }}"><div class="accordion-body last-paragraph-no-margin">{{ item.content|richtext }}</div></div></div>{% endfor %}</div>
