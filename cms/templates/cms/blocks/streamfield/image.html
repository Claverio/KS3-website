{% load wagtailimages_tags %}{% image value.image width-1600 as rendered_image %}<figure class="mt-40px mb-40px"><img src="{{ rendered_image.url }}" width="{{ rendered_image.width }}" height="{{ rendered_image.height }}" alt="{{ value.alt_text|default:value.image.title }}" class="border-radius-10px w-100">{% if value.caption %}<figcaption class="fs-13 text-medium-gray mt-10px">{{ value.caption }}</figcaption>{% endif %}</figure>
