{% load wagtailimages_tags %}{% image value.left_image fill-800x800 as left %}{% image value.right_image fill-800x800 as right %}<div class="row g-4 mb-40px"><div class="col-sm-6"><img src="{{ left.url }}" width="{{ left.width }}" height="{{ left.height }}" alt="{{ value.left_alt_text|default:value.left_image.title }}" class="border-radius-10px w-100"></div><div class="col-sm-6"><img src="{{ right.url }}" width="{{ right.width }}" height="{{ right.height }}" alt="{{ value.right_alt_text|default:value.right_image.title }}" class="border-radius-10px w-100"></div></div>
