{% load wagtailcore_tags %}<div class="alert border-0 border-radius-10px p-25px mb-35px {% if value.tone == 'warning' %}bg-warning bg-opacity-10 text-dark-gray{% elif value.tone == 'success' %}bg-success bg-opacity-10 text-dark-gray{% else %}bg-base-transparent-light text-dark-gray{% endif %}" role="note">{% if value.title %}<h5 class="alt-font fw-700 mb-10px">{{ value.title }}</h5>{% endif %}<div class="last-paragraph-no-margin">{{ value.content|richtext }}</div></div>
