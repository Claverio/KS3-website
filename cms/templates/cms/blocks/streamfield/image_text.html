{% load wagtailcore_tags wagtailimages_tags %}{% image value.image width-900 as rendered_image %}<div class="row align-items-center mb-40px{% if value.image_position == 'right' %} flex-row-reverse{% endif %}"><div class="col-md-6 sm-mb-20px"><img src="{{ rendered_image.url }}" width="{{ rendered_image.width }}" height="{{ rendered_image.height }}" alt="{{ value.image.title }}" class="border-radius-10px w-100"></div><div class="col-md-6">{% if value.title %}<h4 class="alt-font text-dark-gray fw-700 mb-15px">{{ value.title }}</h4>{% endif %}<div class="rich-text-content">{{ value.content|richtext }}</div></div></div>
