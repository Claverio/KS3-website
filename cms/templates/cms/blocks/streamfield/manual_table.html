<div class="table-responsive mb-40px">{% if value.title %}<h5 class="alt-font text-dark-gray fw-700 mb-20px">{{ value.title }}</h5>{% endif %}<table class="table table-striped"><thead><tr>{% for column in value.columns %}<th scope="col">{{ column }}</th>{% endfor %}</tr></thead><tbody>{% for row in value.rows %}<tr>{% for cell in row.cells %}<td>{{ cell }}</td>{% endfor %}</tr>{% endfor %}</tbody></table>{% if value.footer_note %}<p class="fs-13 text-medium-gray mb-0">{{ value.footer_note }}</p>{% endif %}</div>
