{% extends 'cms/base/base.html' %}{% load wagtailcore_tags %}
{% block content %}{% include 'cms/components/page_title.html' %}<section id="down-section"><div class="container"><div class="row row-cols-1 row-cols-md-2 row-cols-lg-3">{% for item in pages %}<div class="col mb-30px"><a href="{% pageurl item %}" class="d-block bg-white border border-color-extra-medium-gray border-radius-10px p-30px h-100"><h4 class="alt-font text-dark-gray fw-700 mb-10px">{{ item.title }}</h4><p class="mb-15px">{{ item.introduction }}</p><span class="alt-font fw-600 text-base-color">Baca selengkapnya <i class="fa-solid fa-arrow-right ms-5px"></i></span></a></div>{% empty %}<div class="col-12">Belum ada halaman informasi.</div>{% endfor %}</div></div></section>{% endblock %}
