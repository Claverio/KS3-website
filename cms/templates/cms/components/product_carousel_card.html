{% load wagtailimages_tags %}<div class="swiper-slide box-shadow-extra-large"><div class="border-radius-10px bg-white pt-40px pb-40px ps-50px pe-50px xxl-p-30px h-100"><a href="{{ product.get_absolute_url }}" class="text-center d-block mb-40px md-mb-30px">{% if product.card_image %}{% image product.card_image width-244 as card_image %}<img src="{{ card_image.url }}" width="{{ card_image.width }}" height="{{ card_image.height }}" alt="{{ product.title }}">{% else %}<span class="h-150px d-flex align-items-center justify-content-center"><i class="bi {{ product.icon }} fs-60 text-base-color"></i></span>{% endif %}</a><div class="last-paragraph-no-margin text-center text-md-start"><a href="{{ product.get_absolute_url }}" class="d-inline-block alt-font text-dark-gray fw-600 fs-20 mb-5px ls-minus-05px">{{ product.title }}</a><p>{{ product.summary }}</p></div></div></div>
