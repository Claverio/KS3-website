services:
  web:
    build: .
    ports:
      - "127.0.0.1:8004:8000"
    env_file:
      - backend/settings/.env
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=10)"
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
